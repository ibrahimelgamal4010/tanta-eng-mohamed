<script>
Array.prototype.toString=function(){return this.join('')};
const isN=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const openX=(u,t)=>{if(isN())Capacitor.Plugins.App.openUrl({url:u}).catch(()=>{});else window.open(u,t)};
const doPrint=(land,n)=>setTimeout(()=>{if(isN()&&Capacitor.Plugins.Printer)Capacitor.Plugins.Printer.print({name:String(n||'report').replace(/[\\\/:*?"<>|\u200F]/g,'-'),landscape:!!land}).catch(e=>alert('تعذرت الطباعة: '+e));else print()},300);
const backBtn=()=>{if(!isN())return;Capacitor.Plugins.App.addListener('backButton',()=>{const B={unit:'home',form:cur?'unit':'home',hist:'unit',arch:'unit',ur:'unit',pm:'unit',pl:'home',rep:'home',admin:'home',bc:'admin'};if(B[view])go(B[view]);else if(view=='home')out();else Capacitor.Plugins.App.exitApp()})};
const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SECRET='mohamed elgamal',MGR='مهندس بحري/ محمد الجمل';
const FL=[['name','اسم الوحدة'],['gov','كود المحافظة',,1],['num','رقم الوحدة',,1],['old','الرقم القديم'],['res','محل الإقامة'],['type','نوع الوحدة',['لنش','قارب','عبارة'],1],['mat','مادة الصنع',['خشب','حديد'],1],['op','طريقة التشغيل',['آلي','واير','حبل','مجداف','ثابت'],1],['purpose','الغرض',['نزهة خاصة','نقل ركاب','معدية سيارات','نقل بضائع','بيع أسماك','قاعة أفراح'],1],['dL','الطول (م)',,1],['dW','العرض (م)',,1],['dH','الارتفاع (م)'],['li','تاريخ إصدار التصريح','d',1],['le','تاريخ نهاية التصريح','d',1],['dry','تاريخ نهاية الجفاف','d',1],['dryE','اسم مهندس الجفاف',,1],['water','تاريخ نهاية المياه','d',1],['waterE','اسم مهندس المياه',,1],['load','الحمولة',,1],['pax','عدد الركاب','n',1],['crew','عدد أفراد الطاقم','n',1],['cars','عدد السيارات','n',1],['bikes','عدد الدراجات البخارية','n',1],['jackets','عدد الجواكت','n',1],['rings','عدد أطواق النجاة','n',1],['e6','عدد طفاية 6 كجم','n',1],['e2','عدد طفاية 2 كجم','n',1],['boat','عدد البلم','n',1],['site','موقع الوحدة'],['loc','لينك الموقع (جوجل ماب)'],['cx','الإحداثي الأفقي',,1],['cy','الإحداثي الرأسي',,1]];
const DF=[['li','تاريخ إصدار التصريح'],['le','تاريخ نهاية التصريح'],['dry','نهاية الجفاف'],['water','نهاية المياه']];
const fd=v=>/^\d{4}-\d\d-\d\d$/.test(v||'')?v.split('-').reverse().join('/'):(v||'');
const iso=v=>{v=String(v||'').replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632);const m=v.trim().match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/);if(!m||+m[1]<1||+m[1]>31||+m[2]<1||+m[2]>12)return'';return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')};
const msk=el=>{let d=el.value.replace(/[٠-٩]/g,c=>c.charCodeAt(0)-1632).replace(/\D/g,'').slice(0,8);el.value=d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d};
const di=(id,v,fn)=>`<input ${id?`id="${id}"`:''} inputmode="numeric" maxlength="10" placeholder="يوم/شهر/سنة" value="${fd(v)}" oninput="msk(this);${fn||''}">`;
const nf=u=>u.num?u.num+(u.gov?'\u200F/\u200F'+u.gov:'')+'مصر':'';
const DK=FL.filter(f=>f[2]=='d').map(f=>f[0]);
const val=(u,k)=>k=='owners'?ow(u):k=='phones'?(u.phones||[]).join('، '):k=='st'?st(u):k=='num'?nf(u):DK.includes(k)?fd(u[k]):(u[k]??'');
let DB,role,view='splash',cur=null,F={q:'',m:'all',df:'',a:'',b:''},AF={k:'',m:'all',a:'',b:''},asof='';
const idb=()=>new Promise(r=>{const q=indexedDB.open('rta',1);q.onupgradeneeded=()=>q.result.createObjectStore('s');q.onsuccess=()=>r(q.result)});
const load=async()=>{if(window.desk){const t=await desk.read();return t?JSON.parse(t):null}const d=await idb();return new Promise(r=>{const q=d.transaction('s').objectStore('s').get('db');q.onsuccess=()=>r(q.result)})};
let FH=null,FOK=false;const JT=[{description:'JSON',accept:{'application/json':['.json']}}];
const idbPut=async(k,v)=>{const d=await idb();return new Promise(r=>{const t=d.transaction('s','readwrite');t.objectStore('s').put(v,k);t.oncomplete=r})};
const idbGet=async k=>{const d=await idb();return new Promise(r=>{const q=d.transaction('s').objectStore('s').get(k);q.onsuccess=()=>r(q.result)})};
const persist=async()=>window.desk?desk.write(JSON.stringify(DB)):idbPut('db',DB);
const save=async()=>{DB.dirty=(DB.dirty||0)+1;await persist();if(FH&&FOK)try{const w=await FH.createWritable();await w.write(snapDB());await w.close()}catch(e){FOK=false;alert('تعذر الكتابة في ملف البيانات. أعد ربطه من لوحة المدير')}};
const fixDB=()=>{const mo2=x=>x.owners=(x.owners||[]).map(o=>typeof o=='string'?{n:o,s:''}:o);DB.units=DB.units||[];DB.hist=DB.hist||[];DB.permits=DB.permits||[];DB.units.forEach(mo2);DB.units.forEach(x=>{if(x.xy&&!x.cx){const q=String(x.xy).split(/[,،\s]+/).filter(Boolean);x.cx=q[0]||'';x.cy=q[1]||''}});DB.hist.forEach(h=>mo2(h.s))};
async function readFH(){try{const t=await (await FH.getFile()).text();if(t.trim()){const d=JSON.parse(t);if(d.units){DB={...d,pw:DB.pw,code:DB.code,phone:DB.phone};fixDB();await idbPut('db',DB)}}else await save()}catch(e){alert('تعذر قراءة ملف البيانات')}}
async function linkNew(){if(!window.showSaveFilePicker)return alert('المتصفح لا يدعم هذه الميزة. استخدم Chrome أو Edge على الكمبيوتر');try{FH=await showSaveFilePicker({suggestedName:'rta-data.json',types:JT});FOK=true;await idbPut('fh',FH);await save();alert('تم إنشاء ملف البيانات وربطه. أي تعديل هيتحفظ فيه تلقائياً');R()}catch(e){}}
async function linkOld(){if(!window.showOpenFilePicker)return alert('المتصفح لا يدعم هذه الميزة. استخدم Chrome أو Edge على الكمبيوتر');try{if(DB.units.length&&!confirm('سيتم استبدال البيانات الحالية ببيانات الملف. متأكد؟'))return;const[h]=await showOpenFilePicker({types:JT});FH=h;FOK=await h.requestPermission({mode:'readwrite'})=='granted';if(!FOK)return alert('لازم توافق على صلاحية الكتابة');await readFH();await idbPut('fh',h);alert('تم تحميل البيانات وربط الملف');go('login')}catch(e){}}
async function fhOn(){try{FOK=await FH.requestPermission({mode:'readwrite'})=='granted';if(FOK){await readFH();go('login')}}catch(e){}}
const restoreCard=()=>`<div class="card"><b>عندك بيانات سابقة؟</b><br>${window.showOpenFilePicker&&!window.desk?'<button class="k" onclick="linkOld()">📂 ربط ملف بيانات موجود</button>':''}<label>استرجاع نسخة احتياطية (JSON)</label><input type="file" accept=".json" onchange="rs(this.files[0])"></div>`;
const go=(v,u)=>{view=v;if(u!==undefined)cur=u;R();scrollTo(0,0)};
const U=id=>DB.units.find(u=>u.id==id);
const bar=(t,back)=>`<div class="bar">${back?`<button class="g" onclick="go('${back}')">→</button>`:''}<h1>${t}</h1></div>`;
const days=d=>d?Math.ceil((new Date(d)-new Date(new Date().toDateString()))/864e5):null;
const bdg=d=>{const n=days(d);return n===null?'':n<0?'<span class="bd x">منتهي</span>':n<=30?`<span class="bd o">ينتهي بعد ${n} يوم</span>`:'<span class="bd">ساري</span>'};
const rd=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1100/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.72))};i.src=URL.createObjectURL(f)});
const wa=(n,t)=>{n=String(n).replace(/\D/g,'');if(n.startsWith('0'))n='2'+n;openX('https://wa.me/'+n+'?text='+encodeURIComponent(t||''),'_blank')};
const mapUrl=u=>{const l=u.loc||'';return /^http/.test(l)?l:'https://www.google.com/maps?q='+encodeURIComponent(l||(u.cy&&u.cx?u.cy+','+u.cx:'')||u.site||u.addr||u.name||'')};
const map=u=>openX(mapUrl(u),'_blank');
const qrRow=u=>{if(!u.loc&&!(u.cx&&u.cy))return'<tr><th>الموقع</th><td colspan="3">—</td></tr>';let im='';try{const q=qrcode(0,'M');q.addData(mapUrl(u));q.make();im=`<img src="${q.createDataURL(6,2)}" style="width:30mm;height:30mm">`}catch(e){}return`<tr><th>الموقع<br><small>(امسح الكود لفتح الموقع)</small></th><td colspan="3">${im}<div style="font-size:10px">${E(u.site||'')} ${u.cx?'أفقي: '+E(u.cx):''} ${u.cy?'رأسي: '+E(u.cy):''}</div></td></tr>`};
function R(){const a=$('#app');a.innerHTML=({splash,login,home,unit,form,hist,arch,admin,bc,rep,ur,pl,pm})[view]();}
function splash(){setTimeout(()=>go('login'),2600);return`<div class="sp"><img src="logo.png"><h2>إدارة منطقة طنطا</h2><div>${MGR}</div></div>`}
/* ---------- login ---------- */
function login(){if(!DB.pw)return`${bar('إعداد البرنامج لأول مرة')}<div class="w"><div class="card"><label>كلمة السر</label><input id="p1" type="password"><label>الرقم الثابت (يُستخدم عند تغيير كلمة السر)</label><input id="p2"><label>رقم الموبايل الثابت (واتساب، لا يمكن تغييره)</label><input id="p3" type="tel" placeholder="01xxxxxxxxx"><button onclick="setup()">حفظ والبدء</button></div>${restoreCard()}</div>`;
return`<div class="w" style="text-align:center;padding-top:40px"><img src="logo.png" width="170"><h2 style="color:var(--b);margin:8px">إدارة منطقة طنطا</h2><div>${MGR}</div><div class="card" style="margin-top:20px"><input id="pw" type="password" placeholder="كلمة السر"><button onclick="enter()">دخول مدير</button><button class="g" onclick="role='v';go('home')">دخول عرض فقط</button><br><button class="g" onclick="forgot()">نسيت كلمة السر؟ (إرسال على واتساب)</button>${FH&&!FOK?'<br><button class="k" onclick="fhOn()">🔗 تفعيل ملف البيانات المرتبط</button>':''}</div></div>`}
async function setup(){const p=[p1,p2,p3].map(x=>x.value.trim());if(p.some(x=>!x))return alert('أكمل كل الحقول');DB.pw=p[0];DB.code=p[1];DB.phone=p[2];await save();role='a';go('home')}
const enter=()=>{if(pw.value===DB.pw){role='a';go('home')}else alert('كلمة السر غير صحيحة')};
const forgot=()=>{if(confirm('سيتم فتح واتساب لإرسال البيانات إلى الرقم الثابت المسجل'))wa(DB.phone,`بيانات الدخول - برنامج إدارة منطقة طنطا\nكلمة السر: ${DB.pw}\nالرقم الثابت لتغيير كلمة السر: ${DB.code}`)};
/* ---------- home / search ---------- */
function match(u){const q=F.q.trim().toLowerCase(),o=ow(u);const s=F.m=='num'?(u.gov||'')+(u.num||'')+(u.old||''):F.m=='name'?u.name:F.m=='own'?o:[u.name,u.gov,u.num,u.old,o,u.res,(u.phones||[]).join(' ')].join(' ');
if(q&&!String(s).toLowerCase().includes(q))return 0;if(F.g&&String(u.gov||'').trim()!=F.g.trim())return 0;if(F.df){const v=u[F.df];if(!v||(F.a&&v<F.a)||(F.b&&v>F.b))return 0}return 1}
function home(){const L=DB.units.filter(match);return`${bar('وحدات منطقة طنطا ('+L.length+')')}<div class="w">${role=='a'&&!window.desk?bkBar():''}<div class="card">
<div class="row"><input placeholder="بحث..." value="${E(F.q)}" oninput="F.q=this.value;lst()"><select onchange="F.m=this.value;lst()"><option value="all">الكل</option><option value="num" ${F.m=='num'?'selected':''}>رقم الوحدة</option><option value="name" ${F.m=='name'?'selected':''}>اسم الوحدة</option><option value="own" ${F.m=='own'?'selected':''}>اسم المالك</option></select></div>
<div class="row"><input placeholder="تصفية بكود المحافظة" value="${E(F.g||'')}" oninput="F.g=this.value;lst()"></div><div class="row"><select onchange="F.df=this.value;lst()"><option value="">تصفية بتاريخ...</option>${DF.map(d=>`<option value="${d[0]}" ${F.df==d[0]?'selected':''}>${d[1]}</option>`)}</select>${di('',F.a,'F.a=iso(this.value);lst()')}${di('',F.b,'F.b=iso(this.value);lst()')}</div>
<button onclick="listPdf()">📄 تقرير PDF للنتائج</button><button class="g" onclick="xlList()">⬇ Excel</button><button class="g" onclick="go('rep')">📊 التقارير</button><button class="k" onclick="go('pl')">🪪 إصدار التصاريح</button>${role=='a'?`<button class="k" onclick="go('form',null)">＋ وحدة جديدة</button><button class="g" onclick="go('admin')">⚙ الإدارة</button>`:''}<button class="g" onclick="out()">خروج</button></div><div id="L">${cards(L)}</div></div>`}
const title=u=>(u.name?u.name+(u.num?' - ':''):'')+(u.num?'رقم '+nf(u):(u.name?'':'وحدة بدون رقم'));
const ow=u=>(u.owners||[]).map(o=>typeof o=='string'?o:o.n+(o.s?` (${o.s} قيراط)`:'')).join('، ');
const cards=L=>L.map(u=>`<div class="card" onclick="go('unit',${u.id})"><b>${E(title(u))}</b> — ${E(ow(u)||'—')}<br><small>${E(u.type)} | ${E(u.purpose)} | ${E(u.op)}</small><br>انتهاء التصريح: ${E(fd(u.le)||'—')} ${bdg(u.le)}</div>`).join('')||'<div class="card">لا توجد نتائج</div>';
const lst=()=>{$('#L').innerHTML=cards(DB.units.filter(match))};
/* ---------- unit ---------- */
