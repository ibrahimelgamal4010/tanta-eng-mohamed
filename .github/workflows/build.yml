name: Build Android APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Copy offline libs
        run: |
          mkdir -p www/node_modules/exceljs/dist www/node_modules/qrcode-generator www/node_modules/@fontsource/cairo/files
          cp node_modules/exceljs/dist/exceljs.min.js www/node_modules/exceljs/dist/
          cp node_modules/qrcode-generator/qrcode.js www/node_modules/qrcode-generator/
          for f in cairo-arabic-400-normal cairo-latin-400-normal cairo-arabic-700-normal cairo-latin-700-normal; do cp node_modules/@fontsource/cairo/files/$f.woff2 www/node_modules/@fontsource/cairo/files/; done
      - name: Create Android project
        run: npx cap add android
      - name: Add printing plugin and icons
        run: |
          cp android-extra/MainActivity.java android/app/src/main/java/eg/rta/tanta/MainActivity.java
          cp android-extra/PrinterPlugin.java android/app/src/main/java/eg/rta/tanta/PrinterPlugin.java
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          cp -r android-extra/res/* android/app/src/main/res/
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RTA-Tanta-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
